name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual redeploy of the current main (e.g. after changing Pages env vars).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Pinned: Playwright cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm check
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY || 'placeholder' }}

      # The `client` vitest project runs component tests in headless Chromium.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build
          # _worker.js imports from output/ and cloudflare-tmp/; wrangler bundles
          # them at deploy time, so all three must travel together.
          path: |
            .svelte-kit/cloudflare
            .svelte-kit/cloudflare-tmp
            .svelte-kit/output
          include-hidden-files: true
          retention-days: 7

  # Production deploy: only from main, only after every check above passed.
  # Cloudflare's own Git auto-deploy is disabled; this is the single path to prod.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sklonuj.com
    # Never run two deploys at once; a newer push waits rather than cancelling
    # a deploy that is already uploading.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-build
          path: .svelte-kit

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs the lockfile-pinned wrangler used by wrangler-action.
      - run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: >-
            pages deploy .svelte-kit/cloudflare
            --project-name=sklonuj
            --branch=main
            --commit-hash=${{ github.sha }}

      - name: Smoke test deployment
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          # Verify the deploy is actually serving by hitting a STATIC asset
          # (robots.txt). Static files are served by Cloudflare's CDN independently
          # of the Pages Function, so they return 200 even when the daily request
          # cap has temporarily disabled the function. A failure here means a
          # genuinely broken deploy, so this is the only hard gate.
          served=0
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/robots.txt" || echo 000)
            if [ "$status" = "200" ]; then
              echo "$DEPLOY_URL/robots.txt -> 200 (deploy is serving)"
              served=1
              break
            fi
            echo "$DEPLOY_URL/robots.txt -> $status (attempt $attempt), retrying"
            sleep 10
          done
          if [ "$served" != "1" ]; then
            echo "::error::$DEPLOY_URL/robots.txt did not return 200 — the deploy appears broken"
            exit 1
          fi

          # Non-fatal: the server-rendered homepage on production. A non-200 here
          # almost always means the site is over its daily Worker request cap
          # (the function is disabled, so SSR routes 404/5xx) rather than a bad
          # deploy — which the hard check above already ruled out. Warn, don't fail,
          # so a rate-limited site doesn't mark a successful deploy as failed.
          home=$(curl -s -o /dev/null -w '%{http_code}' "https://sklonuj.com/" || echo 000)
          if [ "$home" = "200" ]; then
            echo "https://sklonuj.com/ -> 200"
          else
            echo "::warning::https://sklonuj.com/ -> $home — static assets deployed fine; the SSR function looks rate-limited (daily Worker request cap)."
          fi
